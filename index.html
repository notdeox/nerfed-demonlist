<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    updateDoc,
    deleteDoc,
    doc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
    apiKey: "AIzaSyBU2arXqJml65u3XNNHke7PVdEC0X95rLo",
    authDomain: "nerfed-demonlist.firebaseapp.com",
    projectId: "nerfed-demonlist",
    storageBucket: "nerfed-demonlist.firebasestorage.app",
    messagingSenderId: "996399312994",
    appId: "1:996399312994:web:3cd9bc6b38185e4666a13b",
    measurementId: "G-D9BVJBBGTQ"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);


/* =========================
   ADMIN EMAIL
========================= */

const ADMIN_EMAIL = "YOUR_EMAIL_HERE";


/* =========================
   NDL POINTS
========================= */

function calculatePoints(rank) {

    rank = Number(rank);

    if (rank < 1 || rank > 150) {
        return 0;
    }

    /*
       Temporary NDL scoring curve.

       IMPORTANT:
       #1 = 350
       #2 = 331.71
       #3 = 313.42

       The exact remaining Pointercrate
       values should be inserted here once
       we have the complete official table.
    */

    if (rank === 1) return 350.00;
    if (rank === 2) return 331.71;
    if (rank === 3) return 313.42;

    const start = 313.42;
    const end = 18.71;
    const progress = (rank - 3) / 147;

    return Math.round(
        (start + (end - start) * Math.pow(progress, 0.62))
        * 100
    ) / 100;
}


/* =========================
   LEVELS
========================= */

let levels = [];


/* =========================
   LOAD LEVELS
========================= */

async function loadLevels() {

    const snapshot =
        await getDocs(
            collection(db, "levels")
        );

    levels = [];

    snapshot.forEach(item => {

        levels.push({
            firestoreID: item.id,
            ...item.data()
        });

    });

    renderLevels();
    renderAdmin();
}


/* =========================
   SORT
========================= */

function sortedLevels() {

    return [...levels].sort(
        (a, b) =>
            Number(a.rank) - Number(b.rank)
    );

}


/* =========================
   RENDER DEMONLIST
========================= */

function renderLevels() {

    const list =
        document.getElementById("levelList");

    if (!list) return;

    const sorted =
        sortedLevels();

    let html = "";

    sorted.forEach(level => {

        const rank =
            Number(level.rank);

        const points =
            calculatePoints(rank);

        html += `

        <div class="level"
             onclick="showLevel('${level.firestoreID}')">

            <div class="rank">
                #${rank}
            </div>

            <div class="thumbnail">
                ${level.name.charAt(0)}
            </div>

            <div>

                <div class="level-name">
                    ${level.name}
                </div>

                <div class="creator">
                    by ${level.creator}
                    • verified by ${level.verifier}
                </div>

            </div>

            <div class="points">

                ${points.toFixed(2)}

                <small>
                    points
                </small>

            </div>

        </div>

        `;

    });

    list.innerHTML =
        html ||
        `<div style="padding:40px;text-align:center;color:#858fa1">
            No levels found.
        </div>`;

    const count =
        document.getElementById("levelCount");

    if (count)
        count.textContent =
            levels.length;
}


/* =========================
   SHOW LEVEL
========================= */

window.showLevel = function(id) {

    const level =
        levels.find(
            x => x.firestoreID === id
        );

    if (!level) return;

    const points =
        calculatePoints(level.rank);

    document.getElementById(
        "detailContent"
    ).innerHTML = `

        <div class="big-thumbnail">
            ${level.name.charAt(0)}
        </div>

        <h2>
            ${level.name}
        </h2>

        <p class="muted">
            Rank #${level.rank}
            •
            ${level.difficulty}
        </p>

        <p class="muted">
            Created by <b>${level.creator}</b>
            • Verified by <b>${level.verifier}</b>
        </p>

        <div class="info-grid">

            <div class="info-box">
                <span>Rank</span>
                <b>#${level.rank}</b>
            </div>

            <div class="info-box">
                <span>Points</span>
                <b>${points.toFixed(2)}</b>
            </div>

            <div class="info-box">
                <span>Difficulty</span>
                <b>${level.difficulty}</b>
            </div>

            <div class="info-box">
                <span>Level ID</span>
                <b>${level.levelID}</b>
            </div>

        </div>

        <br>

        ${
            level.video
            ?
            `<a href="${level.video}" target="_blank">
                <button class="primary">
                    Watch Showcase
                </button>
            </a>`
            :
            ""
        }

    `;

    showPage("detail");
};


/* =========================
   ADMIN
========================= */

function renderAdmin() {

    const list =
        document.getElementById("adminList");

    if (!list) return;

    const sorted =
        sortedLevels();

    let html = "";

    sorted.forEach(level => {

        html += `

        <div class="admin-row">

            <div>

                <b>
                    #${level.rank}
                    ${level.name}
                </b>

                <div class="creator">
                    ${level.creator}
                    •
                    ${calculatePoints(level.rank).toFixed(2)}
                    points
                </div>

            </div>

            <div>
                ${level.difficulty}
            </div>

            <div>

                <button
                    class="edit"
                    onclick="openEdit('${level.firestoreID}')">

                    Edit

                </button>

                <button
                    class="delete"
                    onclick="deleteLevel('${level.firestoreID}')">

                    Delete

                </button>

            </div>

        </div>

        `;

    });

    list.innerHTML = html;
}


/* =========================
   ADD LEVEL
========================= */

window.saveLevel = async function() {

    const name =
        document.getElementById("levelName").value.trim();

    const levelID =
        document.getElementById("levelID").value.trim();

    const creator =
        document.getElementById("levelCreator").value.trim();

    const verifier =
        document.getElementById("levelVerifier").value.trim();

    const difficulty =
        document.getElementById("levelDifficulty").value;

    const rank =
        Number(
            document.getElementById("levelRank").value
        );

    const video =
        document.getElementById("levelVideo").value.trim();


    if (
        !name ||
        !levelID ||
        !creator ||
        !verifier ||
        !difficulty ||
        !rank ||
        !video
    ) {

        alert(
            "Please fill out every field."
        );

        return;
    }


    if (rank < 1 || rank > 150) {

        alert(
            "Rank must be between 1 and 150."
        );

        return;
    }


    const editID =
        document.getElementById("editID").value;


    const data = {

        name,
        levelID,
        creator,
        verifier,
        difficulty,
        rank,
        video

    };


    try {

        if (editID) {

            await updateDoc(
                doc(db, "levels", editID),
                data
            );

        } else {

            await addDoc(
                collection(db, "levels"),
                data
            );

        }

        closeModal();

        await loadLevels();

    } catch (error) {

        console.error(error);

        alert(
            "Firebase error: " +
            error.message
        );

    }

};


/* =========================
   DELETE
========================= */

window.deleteLevel = async function(id) {

    const level =
        levels.find(
            x => x.firestoreID === id
        );

    if (!level) return;

    if (
        !confirm(
            `Delete ${level.name}?`
        )
    ) return;

    try {

        await deleteDoc(
            doc(db, "levels", id)
        );

        await loadLevels();

    } catch (error) {

        alert(
            "Firebase error: " +
            error.message
        );

    }

};


/* =========================
   LOGIN
========================= */

window.login = async function() {

    const email =
        document.getElementById("loginEmail").value;

    const password =
        document.getElementById("loginPassword").value;

    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    } catch (error) {

        alert(
            "Login failed: " +
            error.message
        );

    }

};


/* =========================
   LOGOUT
========================= */

window.logout = function() {

    signOut(auth);

};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
    auth,
    user => {

        if (user) {

            console.log(
                "Logged in:",
                user.email
            );

        }

    }
);


/* =========================
   PAGE SWITCHING
========================= */

window.showPage = function(page) {

    document
        .querySelectorAll(".page")
        .forEach(
            x => x.classList.remove("active")
        );

    document
        .getElementById(page)
        .classList.add("active");

};


/* =========================
   MODAL
========================= */

window.closeModal = function() {

    document
        .getElementById("modal")
        .classList.remove("active");

};


window.openAdd = function() {

    document.getElementById(
        "modalTitle"
    ).textContent = "Add Level";

    document.getElementById(
        "editID"
    ).value = "";

    document
        .querySelectorAll(".form input")
        .forEach(x => x.value = "");

    document.getElementById(
        "levelDifficulty"
    ).value = "Extreme";

    document
        .getElementById("modal")
        .classList.add("active");

};


window.openEdit = function(id) {

    const level =
        levels.find(
            x => x.firestoreID === id
        );

    if (!level) return;

    document.getElementById(
        "modalTitle"
    ).textContent = "Edit Level";

    document.getElementById(
        "editID"
    ).value = id;

    document.getElementById(
        "levelName"
    ).value = level.name;

    document.getElementById(
        "levelID"
    ).value = level.levelID;

    document.getElementById(
        "levelCreator"
    ).value = level.creator;

    document.getElementById(
        "levelVerifier"
    ).value = level.verifier;

    document.getElementById(
        "levelDifficulty"
    ).value = level.difficulty;

    document.getElementById(
        "levelRank"
    ).value = level.rank;

    document.getElementById(
        "levelVideo"
    ).value = level.video;

    document
        .getElementById("modal")
        .classList.add("active");

};


/* =========================
   START
========================= */

loadLevels();

</script>
